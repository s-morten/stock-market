[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reit-dashboard"
version = "0.1.0"
description = "Dashboard for analysis of US REIT data sourced from SEC EDGAR"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "pandas>=2.0",
    "altair>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reit_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
